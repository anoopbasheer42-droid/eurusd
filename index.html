<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swing Commander</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: #0a0e14; color: #d4d4d4;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.4; }
  .header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #1e2530; padding-bottom: 8px; margin-bottom: 12px; }
  .pair { font-size: 16px; font-weight: 700; color: #5fb3ff; letter-spacing: 1px; }
  .time { font-size: 11px; color: #666; }
  .row { display: flex; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .card { background: #11161f; border: 1px solid #1e2530; border-radius: 6px; padding: 10px 12px; }
  .price-box { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .price { font-size: 30px; font-weight: 700; color: #fff; }
  .regime { font-size: 12px; padding: 2px 8px; border-radius: 3px; background: #2a1a1a; color: #ff7b7b; }
  .regime.TREND_UP { background: #16351f; color: #6dff8a; }
  .regime.TREND_DOWN { background: #35161a; color: #ff7b7b; }
  .regime.RANGE, .regime.TRANSITION { background: #2a2416; color: #ffc966; }
  .bias { font-size: 13px; font-weight: 600; }
  .bias.SELL { color: #ff7b7b; }
  .bias.BUY { color: #6dff8a; }
  .bias.WAIT { color: #888; }
  .section-title { font-size: 11px; color: #666; letter-spacing: 1.5px; margin: 12px 0 6px; text-transform: uppercase; }
  .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .mode-card { background: #11161f; border: 1px solid #1e2530; border-radius: 6px; padding: 12px; }
  .mode-card.open { border-color: #2d5c3a; }
  .mode-card.open.sell { border-color: #5c2d2d; }
  .mode-name { font-size: 12px; color: #5fb3ff; letter-spacing: 1px; margin-bottom: 8px; }
  .mode-status { font-size: 11px; padding: 2px 6px; border-radius: 3px; display: inline-block; margin-bottom: 8px; }
  .status-open { background: #16351f; color: #6dff8a; }
  .status-wait { background: #1e2530; color: #888; }
  .status-cooldown { background: #2a2416; color: #ffc966; }
  .trade-line { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
  .trade-line .k { color: #666; }
  .trade-line .v { font-weight: 600; }
  .wl { margin-top: 8px; font-size: 12px; color: #888; }
  .wl .w { color: #6dff8a; }
  .wl .l { color: #ff7b7b; }
  .engines { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .eng { text-align: center; padding: 6px 4px; border-radius: 4px; background: #11161f; border: 1px solid #1e2530; }
  .eng .name { font-size: 10px; color: #666; letter-spacing: 0.5px; }
  .eng .score { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .eng .side { font-size: 10px; margin-top: 2px; }
  .eng.buy .score, .eng.buy .side { color: #6dff8a; }
  .eng.sell .score, .eng.sell .side { color: #ff7b7b; }
  .eng.wait .score { color: #666; }
  .sr-list { display: flex; gap: 8px; flex-wrap: wrap; }
  .sr-item { padding: 4px 8px; background: #11161f; border: 1px solid #1e2530; border-radius: 4px; font-size: 12px; }
  .sr-item .lbl { color: #666; margin-left: 4px; }
  .sr-item .val { color: #fff; font-weight: 600; }
  .sr-item.res .val { color: #ff7b7b; }
  .sr-item.sup .val { color: #6dff8a; }
  .events { font-size: 12px; color: #ffc966; }
  .err { color: #ff7b7b; padding: 8px; border: 1px solid #5c2d2d; border-radius: 4px; }
  .nav { margin-bottom: 10px; font-size: 12px; }
  .nav a { color: #5fb3ff; text-decoration: none; padding: 4px 10px; border: 1px solid #1e2530; border-radius: 4px; margin-right: 6px; }
  .nav a.active { background: #16351f; color: #6dff8a; border-color: #2d5c3a; }
</style>
</head>
<body>

<div class="nav">
  <a href="swing.html" class="active">SWING COMMANDER</a>
  <a href="index.html">TWO-SIDED SCALPER</a>
</div>

<div class="header">
  <div class="pair">EUR/USD · SWING COMMANDER</div>
  <div class="time" id="time">—</div>
</div>

<div id="root"><div class="card">loading...</div></div>

<script src="swing-engine.js"></script>
</body>
</html>
